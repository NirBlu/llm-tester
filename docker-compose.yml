services:
  web:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./suites:/app/suites
      - ./results:/app/results

  # Optional bundled Ollama: `docker compose --profile ollama up`
  # then set OLLAMA_BASE_URL_DOCKER=http://ollama:11434
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]

volumes:
  ollama:
