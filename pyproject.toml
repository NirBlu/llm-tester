[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtester"
version = "0.1.0"
description = "Home-runnable LLM evaluation tool"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["httpx>=0.27", "pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
llmtester = "llmtester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmtester = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
